---
- name: Provision bare metal EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  tasks:
    # --- Discover RHEL 9 AMI ---

    - name: Find latest RHEL 9 AMI
      amazon.aws.ec2_ami_info:
        owners:
          - "309956199498"  # Red Hat official
        filters:
          name: "RHEL-9.*_HVM-*-x86_64-*-Hourly*-GP3"
          architecture: x86_64
          state: available
      register: rhel_amis

    - name: Select newest RHEL 9 AMI
      ansible.builtin.set_fact:
        ec2_ami: "{{ (rhel_amis.images | sort(attribute='creation_date') | last).image_id }}"
        ec2_ami_name: "{{ (rhel_amis.images | sort(attribute='creation_date') | last).name }}"

    - name: Display selected AMI
      ansible.builtin.debug:
        msg: "Using AMI: {{ ec2_ami }} ({{ ec2_ami_name }})"

    # --- Find VPC and subnet matching *.opentlc.com ---

    - name: Find VPC with opentlc.com domain tag
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "{{ ec2_vpc_domain_pattern }}"
      register: vpc_result

    - name: Fail if no matching VPC found
      ansible.builtin.fail:
        msg: "No VPC found matching '{{ ec2_vpc_domain_pattern }}'. Check your region and VPC tags."
      when: vpc_result.vpcs | length == 0

    - name: Set VPC ID
      ansible.builtin.set_fact:
        ec2_vpc_id: "{{ vpc_result.vpcs[0].vpc_id }}"

    - name: Display VPC info
      ansible.builtin.debug:
        msg: "Using VPC: {{ ec2_vpc_id }} ({{ vpc_result.vpcs[0].tags.Name | default('unnamed') }})"

    - name: Find public subnet in VPC
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ ec2_vpc_id }}"
          map-public-ip-on-launch: "true"
      register: public_subnet_result

    - name: Fall back to any subnet if no public subnet found
      amazon.aws.ec2_vpc_subnet_info:
        filters:
          vpc-id: "{{ ec2_vpc_id }}"
      register: any_subnet_result
      when: public_subnet_result.subnets | length == 0

    - name: Set discovered subnets
      ansible.builtin.set_fact:
        discovered_subnets: "{{ public_subnet_result.subnets if (public_subnet_result.subnets | length > 0) else (any_subnet_result.subnets | default([])) }}"

    - name: Fail if no subnet found
      ansible.builtin.fail:
        msg: "No subnets found in VPC {{ ec2_vpc_id }}."
      when: discovered_subnets | length == 0

    - name: Set subnet ID
      ansible.builtin.set_fact:
        ec2_subnet_id: "{{ discovered_subnets[0].subnet_id }}"

    - name: Display subnet info
      ansible.builtin.debug:
        msg: "Using subnet: {{ ec2_subnet_id }} ({{ discovered_subnets[0].tags.Name | default('unnamed') }})"

    # --- Create key pair ---

    - name: Create local keys directory
      ansible.builtin.file:
        path: "{{ ec2_key_local_path }}"
        state: directory
        mode: "0700"

    - name: Create EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ ec2_key_name }}"
        state: present
      register: ec2_key

    - name: Save private key locally
      ansible.builtin.copy:
        content: "{{ ec2_key.key.private_key }}"
        dest: "{{ ec2_key_local_path }}/{{ ec2_key_name }}.pem"
        mode: "0600"
      when: ec2_key.changed

    - name: Display key info
      ansible.builtin.debug:
        msg: "Key pair '{{ ec2_key_name }}' ready — private key at {{ ec2_key_local_path }}/{{ ec2_key_name }}.pem"

    # --- Create security group ---

    - name: Create security group
      amazon.aws.ec2_security_group:
        name: "{{ ec2_security_group_name }}"
        description: "Security group for mirror-operator hypervisor (SSH, VNC, Cockpit)"
        vpc_id: "{{ ec2_vpc_id }}"
        rules:
          - proto: tcp
            ports: 22
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH
          - proto: tcp
            ports: 5901
            cidr_ip: 0.0.0.0/0
            rule_desc: VNC
          - proto: tcp
            ports: 9090
            cidr_ip: 0.0.0.0/0
            rule_desc: Cockpit
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow all outbound
        state: present
      register: sg_result

    - name: Display security group info
      ansible.builtin.debug:
        msg: "Security group: {{ sg_result.group_id }} ({{ ec2_security_group_name }})"

    # --- Build instance names list ---

    - name: Build list of instance names
      ansible.builtin.set_fact:
        ec2_instance_names: >-
          {{ (ec2_instance_count | int == 1)
             | ternary(
                 [ec2_instance_name],
                 range(1, (ec2_instance_count | int) + 1) | map('regex_replace', '^(.*)$', ec2_instance_name ~ '-\1') | list
               ) }}

    # --- Launch instances ---

    - name: Launch EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ ec2_ami }}"
        key_name: "{{ ec2_key_name }}"
        subnet_id: "{{ ec2_subnet_id }}"
        security_group: "{{ sg_result.group_id }}"
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ ec2_root_volume_size }}"
              volume_type: "{{ ec2_root_volume_type }}"
              iops: "{{ ec2_root_volume_iops }}"
              throughput: "{{ ec2_root_volume_throughput }}"
              delete_on_termination: true
        network:
          assign_public_ip: true
        state: started
        wait: true
      loop: "{{ ec2_instance_names }}"
      register: ec2_results

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ item.instances[0].public_ip_address }}"
        port: 22
        delay: 30
        timeout: 600
      loop: "{{ ec2_results.results }}"
      loop_control:
        label: "{{ item.instances[0].public_ip_address }}"

    - name: Add instances to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.instances[0].public_ip_address }}"
        groups: hypervisors
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "{{ ec2_key_local_path }}/{{ ec2_key_name }}.pem"
      loop: "{{ ec2_results.results }}"
      loop_control:
        label: "{{ item.instances[0].public_ip_address }}"

    - name: Display instance info
      ansible.builtin.debug:
        msg: |
          Instance: {{ item.item }}
          Instance ID: {{ item.instances[0].instance_id }}
          Public IP: {{ item.instances[0].public_ip_address }}
          AMI: {{ ec2_ami }} ({{ ec2_ami_name }})
          VNC: vnc://{{ item.instances[0].public_ip_address }}:5901
          Cockpit: https://{{ item.instances[0].public_ip_address }}:9090
          SSH: ssh -i {{ ec2_key_local_path }}/{{ ec2_key_name }}.pem ec2-user@{{ item.instances[0].public_ip_address }}
      loop: "{{ ec2_results.results }}"
      loop_control:
        label: "{{ item.item }}"
