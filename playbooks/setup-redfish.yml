---
- name: Set up Redfish simulation with sushy-emulator
  hosts: hypervisors
  become: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Install python3-pip
      ansible.builtin.dnf:
        name: python3-pip
        state: present

    - name: Install sushy-tools
      ansible.builtin.pip:
        name: sushy-tools
        state: present

    - name: Create sushy config directory
      ansible.builtin.file:
        path: /etc/sushy
        state: directory
        mode: "0755"

    - name: Create sushy TLS directory
      ansible.builtin.file:
        path: /etc/sushy/tls
        state: directory
        mode: "0755"

    - name: Check if TLS certificate already exists
      ansible.builtin.stat:
        path: "{{ sushy_emulator_ssl_cert }}"
      register: sushy_cert

    - name: Generate self-signed TLS certificate
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048
        -keyout {{ sushy_emulator_ssl_key }}
        -out {{ sushy_emulator_ssl_cert }}
        -days 365 -nodes
        -subj "/CN=sushy-emulator"
      when: not sushy_cert.stat.exists
      notify: Restart sushy-emulator

    - name: Install httpd-tools for htpasswd
      ansible.builtin.dnf:
        name: httpd-tools
        state: present

    # bcrypt (required by sushy-tools/oslo.middleware) rejects passwords > 72 bytes
    - name: Assert sushy-emulator password fits bcrypt limit
      ansible.builtin.assert:
        that:
          - (sushy_emulator_password | length) > 0
          - (sushy_emulator_password | length) <= 72
        fail_msg: >-
          sushy_emulator_password is {{ sushy_emulator_password | length }} characters;
          bcrypt allows at most 72. Shorten the password and re-run.

    # Use htpasswd CLI instead of community.general.htpasswd to avoid passlib/interpreter mismatch
    - name: Create sushy-emulator htpasswd file
      ansible.builtin.command:
        argv:
          - htpasswd
          - -cbB
          - "{{ sushy_emulator_auth_file }}"
          - "{{ sushy_emulator_username }}"
          - "{{ sushy_emulator_password }}"
      changed_when: true
      no_log: true
      notify: Restart sushy-emulator

    - name: Restrict sushy-emulator htpasswd permissions
      ansible.builtin.file:
        path: "{{ sushy_emulator_auth_file }}"
        mode: "0600"

    - name: Deploy sushy-emulator config
      ansible.builtin.template:
        src: ../templates/sushy-emulator.conf.j2
        dest: /etc/sushy/sushy-emulator.conf
        mode: "0644"
      notify: Restart sushy-emulator

    - name: Create systemd service for sushy-emulator
      ansible.builtin.copy:
        dest: /etc/systemd/system/sushy-emulator.service
        mode: "0644"
        content: |
          [Unit]
          Description=Sushy Redfish Emulator
          After=libvirtd.service
          Requires=libvirtd.service

          [Service]
          ExecStart=/usr/local/bin/sushy-emulator --config /etc/sushy/sushy-emulator.conf
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart sushy-emulator

    - name: Open firewall port for sushy-emulator on libvirt zone
      ansible.posix.firewalld:
        port: "{{ sushy_emulator_port }}/tcp"
        zone: libvirt
        permanent: true
        immediate: true
        state: enabled

    - name: Enable and restart sushy-emulator
      ansible.builtin.systemd:
        name: sushy-emulator
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Flush handlers to restart sushy-emulator before health check
      ansible.builtin.meta: flush_handlers

    - name: Wait for sushy-emulator to be ready
      ansible.builtin.command: >
        curl -sk -u {{ sushy_emulator_username }}:{{ sushy_emulator_password }}
        -o /dev/null -w '%{http_code}'
        https://{{ sushy_emulator_listen_ip }}:{{ sushy_emulator_port }}/redfish/v1
      register: redfish_check
      retries: 5
      delay: 3
      until: redfish_check.stdout == "200"
      changed_when: false
      no_log: true

    - name: List available Redfish systems
      ansible.builtin.command: >
        curl -sk -u {{ sushy_emulator_username }}:{{ sushy_emulator_password }}
        https://{{ sushy_emulator_listen_ip }}:{{ sushy_emulator_port }}/redfish/v1/Systems
      register: redfish_systems
      changed_when: false
      no_log: true

    - name: List all libvirt VM names
      ansible.builtin.command: virsh list --all --name
      register: libvirt_vms_raw
      changed_when: false

    - name: Set non-empty libvirt VM names
      ansible.builtin.set_fact:
        libvirt_vm_names: "{{ libvirt_vms_raw.stdout_lines | map('trim') | reject('equalto', '') | list }}"

    - name: Get UUID for each libvirt VM
      ansible.builtin.command: virsh domuuid {{ item }}
      loop: "{{ libvirt_vm_names }}"
      register: vm_uuid_results
      changed_when: false

    - name: Get dumpxml for each libvirt VM
      ansible.builtin.command: virsh dumpxml {{ item }}
      loop: "{{ libvirt_vm_names }}"
      register: vm_xml_results
      changed_when: false

    - name: Build VM to Redfish endpoint list
      ansible.builtin.set_fact:
        redfish_vm_endpoints: >-
          {{
            redfish_vm_endpoints | default([]) + [{
              'vm_name': item.0.item,
              'uuid': item.0.stdout | trim,
              'mac': item.1.stdout | regex_search("mac address='([0-9a-fA-F:]+)'", '\\1'),
              'redfish_url': 'https://' ~ sushy_emulator_listen_ip ~ ':' ~ (sushy_emulator_port | string) ~ '/redfish/v1/Systems/' ~ (item.0.stdout | trim)
            }]
          }}
      loop: "{{ vm_uuid_results.results | zip(vm_xml_results.results) | list }}"
      when: item.0.stdout is defined

    - name: Parse Redfish systems response
      ansible.builtin.set_fact:
        redfish_member_uuids: >-
          {{
            (redfish_systems.stdout | from_json).Members
            | default([])
            | json_query('[]."@odata.id"')
            | default([])
            | map('regex_replace', '.*/Systems/', '')
            | list
          }}

    - name: Display Redfish endpoint summary
      ansible.builtin.debug:
        msg:
          - "Redfish endpoint: https://{{ sushy_emulator_listen_ip }}:{{ sushy_emulator_port }}/redfish/v1"
          - "Redfish Username: {{ sushy_emulator_username }}"
          - "Redfish Password: {{ sushy_emulator_password }}"
          - "Libvirt VMs: {{ redfish_vm_endpoints | default([]) | length }} | Listed in Redfish API: {{ redfish_member_uuids | length }}"

    - name: Display Redfish system details
      ansible.builtin.debug:
        msg:
          - "{{ item.vm_name }}"
          - "  UUID: {{ item.uuid }}"
          - "  MAC:  {{ item.mac }}"
          - "  URL:  {{ item.redfish_url }}{{ ' (not listed by Redfish API)' if item.uuid not in redfish_member_uuids else '' }}"
          - "  User: {{ sushy_emulator_username }}"
          - "  Pass: {{ sushy_emulator_password }}"
      loop: "{{ redfish_vm_endpoints | default([]) | sort(attribute='vm_name') }}"
      loop_control:
        label: "{{ item.vm_name }}"

  handlers:
    - name: Restart sushy-emulator
      ansible.builtin.systemd:
        name: sushy-emulator
        state: restarted
        daemon_reload: true
