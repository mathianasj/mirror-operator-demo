---
- name: Configure OpenShift cluster-wide proxy and trust lab root CA
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all.yml

  tasks:
    - name: Skip cluster proxy configuration when disabled
      ansible.builtin.meta: end_play
      when: not ocp_configure_cluster_proxy | bool

    - name: Skip when proxy/PKI generation is disabled
      ansible.builtin.meta: end_play
      when: not proxy_enabled | bool

    - name: Check root CA exists locally
      ansible.builtin.stat:
        path: "{{ pki_local_export_path }}/root-ca.crt"
      register: root_ca_stat

    - name: Fail when PKI artifacts are missing
      ansible.builtin.fail:
        msg: >-
          Root CA not found at {{ pki_local_export_path }}/root-ca.crt.
          Run site.yml through setup-proxy.yml first.
      when: not root_ca_stat.stat.exists

    - name: Check exported cluster proxy URL exists locally
      ansible.builtin.stat:
        path: "{{ pki_local_export_path }}/cluster-proxy-url"
      register: cluster_proxy_url_stat

    - name: Fail when cluster proxy URL is not available
      ansible.builtin.fail:
        msg: >-
          Cluster proxy URL not found at {{ pki_local_export_path }}/cluster-proxy-url
          and ocp_cluster_proxy_url is not set. Run setup-proxy.yml or set
          ocp_cluster_proxy_url explicitly (e.g. http://<hypervisor-public-ip>:3128).
      when:
        - ocp_cluster_proxy_url | default('') | length == 0
        - not cluster_proxy_url_stat.stat.exists

    - name: Read exported cluster proxy URL
      ansible.builtin.slurp:
        src: "{{ pki_local_export_path }}/cluster-proxy-url"
      register: cluster_proxy_url_slurp
      when: ocp_cluster_proxy_url | default('') | length == 0

    - name: Set cluster proxy URL fact
      ansible.builtin.set_fact:
        ocp_effective_cluster_proxy_url: >-
          {{
            ocp_cluster_proxy_url
            if (ocp_cluster_proxy_url | default('') | length > 0)
            else (cluster_proxy_url_slurp.content | b64decode | trim)
          }}

    - name: Fail when cluster proxy URL points at localhost
      ansible.builtin.fail:
        msg: >-
          Cluster proxy URL '{{ ocp_effective_cluster_proxy_url }}' uses localhost, which
          will not work from OpenShift nodes. Re-run setup-proxy.yml against the hypervisor
          public IP or set -e ocp_cluster_proxy_url=http://<hypervisor-public-ip>:3128
      when: "'localhost' in ocp_effective_cluster_proxy_url or '127.0.0.1' in ocp_effective_cluster_proxy_url"

    - name: Verify kubeconfig file exists
      ansible.builtin.stat:
        path: "{{ ocp_kubeconfig }}"
      register: kubeconfig_stat

    - name: Fail when kubeconfig is missing
      ansible.builtin.fail:
        msg: "Kubeconfig not found at {{ ocp_kubeconfig }}. Set KUBECONFIG or run connect-cluster.yml first."
      when: not kubeconfig_stat.stat.exists

    - name: Verify cluster API is reachable
      ansible.builtin.command:
        cmd: oc get --raw /readyz
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: ocp_readyz
      changed_when: false
      failed_when: ocp_readyz.rc != 0

    - name: Verify hypervisor proxy is reachable from the controller
      ansible.builtin.uri:
        url: "{{ ocp_effective_cluster_proxy_url }}"
        method: GET
        status_code: [400, 403, 407, 501]
        follow_redirects: none
      register: proxy_reachability
      failed_when: false

    - name: Fail when hypervisor proxy is unreachable from the controller
      ansible.builtin.fail:
        msg: >-
          Cannot reach proxy at {{ ocp_effective_cluster_proxy_url }} from this host
          (status={{ proxy_reachability.status | default('connection failed') }}).
          OpenShift nodes must be able to reach the hypervisor on port {{ proxy_listen_port }}.
      when: proxy_reachability.status is not defined or proxy_reachability.status == -1

    - name: Get cluster network configuration
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Network
        name: cluster
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: cluster_network_info

    - name: Get cluster DNS configuration
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: DNS
        name: cluster
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: cluster_dns_info
      when: ocp_cluster_no_proxy_auto_detect | bool

    - name: Get cluster ingress configuration
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: cluster_ingress_info
      when: ocp_cluster_no_proxy_auto_detect | bool

    - name: Get cluster infrastructure configuration
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: cluster_infrastructure_info
      when: ocp_cluster_no_proxy_auto_detect | bool

    - name: Detect machine network CIDRs from node InternalIP addresses
      ansible.builtin.shell: |
        set -euo pipefail
        oc get nodes -o jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}' \
          | awk -F. 'NF==4 {print $1"."$2".0.0/16"}' \
          | sort -u \
          | paste -sd, -
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: node_machine_cidrs
      changed_when: false
      failed_when: false
      when: ocp_cluster_no_proxy_auto_detect | bool

    - name: Build auto-detected cluster noProxy suffixes
      ansible.builtin.set_fact:
        ocp_auto_no_proxy_suffixes: >-
          {{
            [
              ('.' ~ cluster_dns_info.resources[0].spec.baseDomain)
              if (
                ocp_cluster_no_proxy_auto_detect | bool and
                cluster_dns_info.resources | default([]) | length > 0 and
                cluster_dns_info.resources[0].spec.baseDomain | default('') | length > 0
              ) else '',
              ('.' ~ cluster_ingress_info.resources[0].spec.domain)
              if (
                ocp_cluster_no_proxy_auto_detect | bool and
                cluster_ingress_info.resources | default([]) | length > 0 and
                cluster_ingress_info.resources[0].spec.domain | default('') | length > 0
              ) else '',
              (cluster_infrastructure_info.resources[0].status.apiServerInternalURI | urlsplit('hostname'))
              if (
                ocp_cluster_no_proxy_auto_detect | bool and
                cluster_infrastructure_info.resources | default([]) | length > 0 and
                cluster_infrastructure_info.resources[0].status.apiServerInternalURI | default('') | length > 0
              ) else '',
              ('.' ~ cluster_infrastructure_info.resources[0].status.platformStatus.aws.region ~ '.compute.internal')
              if (
                ocp_cluster_no_proxy_auto_detect | bool and
                cluster_infrastructure_info.resources | default([]) | length > 0 and
                cluster_infrastructure_info.resources[0].status.platformStatus.type | default('') == 'AWS' and
                cluster_infrastructure_info.resources[0].status.platformStatus.aws.region | default('') | length > 0
              ) else '',
              node_machine_cidrs.stdout | default(''),
              '169.254.169.254'
              if ocp_cluster_no_proxy_auto_detect | bool else ''
            ]
          }}

    - name: Build cluster noProxy list
      ansible.builtin.set_fact:
        ocp_effective_cluster_no_proxy: >-
          {{
            [
              proxy_no_proxy,
              '.svc',
              '.cluster.local',
              cluster_network_info.resources[0].status.serviceNetwork | default([]) | join(','),
              cluster_network_info.resources[0].status.clusterNetwork | default([]) | map(attribute='cidr') | list | join(','),
              ocp_auto_no_proxy_suffixes | default([]),
              ocp_cluster_no_proxy_extra | default('')
            ]
            | flatten
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | join(',')
            | regex_replace(',+', ',')
            | regex_replace('^,|,$', '')
          }}
      when: cluster_network_info.resources | length > 0

    - name: Fall back to static noProxy list
      ansible.builtin.set_fact:
        ocp_effective_cluster_no_proxy: >-
          {{
            [
              proxy_no_proxy,
              '.svc',
              '.cluster.local',
              ocp_auto_no_proxy_suffixes | default([]),
              ocp_cluster_no_proxy_extra | default('')
            ]
            | flatten
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | join(',')
            | regex_replace(',+', ',')
            | regex_replace('^,|,$', '')
          }}
      when: cluster_network_info.resources | length == 0

    - name: Read root CA PEM for cluster trust bundle
      ansible.builtin.set_fact:
        ocp_root_ca_pem: "{{ lookup('file', pki_local_export_path ~ '/root-ca.crt') }}"

    - name: Fail when root CA PEM is empty
      ansible.builtin.fail:
        msg: "Root CA at {{ pki_local_export_path }}/root-ca.crt is empty or unreadable."
      when: ocp_root_ca_pem | length == 0

    - name: Check exported intermediate CA exists
      ansible.builtin.stat:
        path: "{{ pki_local_export_path }}/intermediate-ca.crt"
      register: intermediate_ca_export_stat

    - name: Read intermediate CA PEM (cert-manager issuer)
      ansible.builtin.set_fact:
        ocp_intermediate_ca_pem: "{{ lookup('file', pki_local_export_path ~ '/intermediate-ca.crt') }}"
      when:
        - ocp_cluster_trust_include_intermediate_ca | bool
        - intermediate_ca_export_stat.stat.exists

    - name: Warn when intermediate CA export is missing
      ansible.builtin.debug:
        msg: >-
          intermediate-ca.crt not found under {{ pki_local_export_path }}; trust bundle will omit
          the cert-manager issuer CA (re-run setup-proxy.yml to export PKI).
      when:
        - ocp_cluster_trust_include_intermediate_ca | bool
        - not intermediate_ca_export_stat.stat.exists

    - name: Get OpenShift ingress router CA secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: router-ca
        namespace: openshift-ingress-operator
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: router_ca_secret
      when: ocp_cluster_trust_include_ingress_ca | bool

    - name: Decode ingress router CA PEM
      ansible.builtin.set_fact:
        ocp_ingress_ca_pem: "{{ router_ca_secret.resources[0].data['tls.crt'] | b64decode }}"
      when:
        - ocp_cluster_trust_include_ingress_ca | bool
        - router_ca_secret.resources | default([]) | length > 0
        - router_ca_secret.resources[0].data.get('tls.crt') is not none

    - name: Fail when ingress router CA is required but missing
      ansible.builtin.fail:
        msg: >-
          Secret openshift-ingress-operator/router-ca not found or tls.crt is empty; cannot add the
          ingress CA to {{ ocp_cluster_trust_bundle_configmap_name }} (needed for *.apps route TLS).
          Set ocp_cluster_trust_include_ingress_ca=false to skip.
      when:
        - ocp_cluster_trust_include_ingress_ca | bool
        - ocp_ingress_ca_pem | default('') | trim | length == 0

    - name: Read existing cluster user-ca-bundle ConfigMap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: "{{ ocp_cluster_trust_bundle_configmap_name }}"
        namespace: "{{ ocp_cluster_trust_bundle_namespace }}"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: existing_user_ca_cm
      when: ocp_cluster_trust_merge_existing_user_ca_bundle | bool

    - name: Capture existing user-ca-bundle PEM
      ansible.builtin.set_fact:
        ocp_existing_user_ca_bundle_pem: >-
          {{
            existing_user_ca_cm.resources[0].data.get('ca-bundle.crt', '')
            if (
              ocp_cluster_trust_merge_existing_user_ca_bundle | bool
              and (existing_user_ca_cm.resources | default([]) | length > 0)
            )
            else ''
          }}

    - name: Stage PEM inputs for trust bundle normalization
      ansible.builtin.copy:
        dest: "{{ pki_local_export_path }}/.trust-bundle-input.pem"
        mode: "0600"
        content: |
          {{ [
            ocp_existing_user_ca_bundle_pem | default(''),
            ocp_root_ca_pem,
            ocp_intermediate_ca_pem | default(''),
            ocp_ingress_ca_pem | default('')
          ] | map('regex_replace', '^\s+|\s+$', '') | reject('equalto', '') | join('\n\n') }}

    - name: Normalize and deduplicate cluster trust bundle PEM
      ansible.builtin.shell: |
        set -euo pipefail
        python3 "{{ playbook_dir }}/files/normalize_pem_bundle.py" \
          < "{{ pki_local_export_path }}/.trust-bundle-input.pem" \
          > "{{ pki_local_export_path }}/.trust-bundle-normalized.pem"
      register: normalize_trust_bundle_cmd
      changed_when: false
      failed_when: normalize_trust_bundle_cmd.rc != 0

    - name: Stat normalized trust bundle output
      ansible.builtin.stat:
        path: "{{ pki_local_export_path }}/.trust-bundle-normalized.pem"
      register: normalized_trust_bundle_stat

    - name: Fail when normalized trust bundle file is missing or empty
      ansible.builtin.fail:
        msg: >-
          normalize_pem_bundle.py did not produce {{ pki_local_export_path }}/.trust-bundle-normalized.pem.
      when: not normalized_trust_bundle_stat.stat.exists or normalized_trust_bundle_stat.stat.size | int < 128

    - name: Reject trust bundles with literal backslash-n (breaks OpenShift parsers)
      ansible.builtin.command:
        cmd: >-
          python3 -c "import pathlib,sys;
          data=pathlib.Path(sys.argv[1]).read_text();
          sys.exit(1 if chr(92)+'n' in data else 0)"
          {{ pki_local_export_path }}/.trust-bundle-normalized.pem
      changed_when: false

    - name: Validate normalized trust bundle with openssl
      ansible.builtin.command:
        cmd: >-
          openssl crl2pkcs7 -nocrl
          -certfile {{ pki_local_export_path }}/.trust-bundle-normalized.pem
          -out /dev/null
      changed_when: false

    - name: Load normalized cluster trust bundle PEM for ConfigMap render
      ansible.builtin.set_fact:
        ocp_cluster_trust_bundle_pem: "{{ lookup('file', pki_local_export_path ~ '/.trust-bundle-normalized.pem') }}"

    - name: Render root CA ConfigMap for cluster trust bundle (phase 1)
      ansible.builtin.template:
        src: ../../templates/cluster-trust-bundle-configmap.yaml.j2
        dest: "{{ pki_local_export_path }}/cluster-trust-bundle-configmap.yaml"
        mode: "0600"

    - name: Render full cluster Proxy manifest (phase 2)
      ansible.builtin.template:
        src: ../../templates/cluster-proxy.yaml.j2
        dest: "{{ pki_local_export_path }}/cluster-proxy.yaml"
        mode: "0600"

    - name: Validate rendered trust bundle ConfigMap contains PEM
      ansible.builtin.command:
        cmd: grep -Fq "BEGIN CERTIFICATE" {{ pki_local_export_path }}/cluster-trust-bundle-configmap.yaml
      changed_when: false

    - name: Validate full Proxy manifest references trust bundle ConfigMap
      ansible.builtin.command:
        cmd: >-
          grep -Fq {{ ocp_cluster_trust_bundle_configmap_name | to_json }}
          {{ pki_local_export_path }}/cluster-proxy.yaml
      changed_when: false

    - name: Validate full manifest contains proxy URL
      ansible.builtin.command:
        cmd: >-
          grep -Fq {{ ocp_effective_cluster_proxy_url | to_json }}
          {{ pki_local_export_path }}/cluster-proxy.yaml
      changed_when: false

    - name: Capture worker MachineConfigPool rendered config before apply
      ansible.builtin.command:
        cmd: oc get machineconfigpool worker -o jsonpath='{.status.configuration.name}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: mcp_worker_before
      changed_when: false

    - name: "Phase 1a — apply root CA ConfigMap in openshift-config"
      ansible.builtin.command:
        cmd: oc apply -f {{ pki_local_export_path }}/cluster-trust-bundle-configmap.yaml
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: trust_bundle_cm_apply
      changed_when: "'configured' in trust_bundle_cm_apply.stdout or 'created' in trust_bundle_cm_apply.stdout"

    - name: Record whether trust bundle ConfigMap apply reported a change
      ansible.builtin.set_fact:
        ocp_trust_bundle_cm_applied: >-
          {{
            'configured' in trust_bundle_cm_apply.stdout
            or 'created' in trust_bundle_cm_apply.stdout
          }}

    - name: "Phase 1b — reference trust bundle ConfigMap from cluster Proxy"
      ansible.builtin.command:
        cmd: >-
          oc patch proxy cluster --type=merge
          -p '{"spec":{"trustedCA":{"name":"{{ ocp_cluster_trust_bundle_configmap_name }}"}}}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: trust_bundle_proxy_patch
      changed_when: trust_bundle_proxy_patch.rc == 0

    - name: Verify trust bundle ConfigMap contains lab root CA
      ansible.builtin.command:
        cmd: >-
          oc get configmap {{ ocp_cluster_trust_bundle_configmap_name }}
          -n {{ ocp_cluster_trust_bundle_namespace }}
          -o jsonpath='{.data.ca-bundle\.crt}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: trust_bundle_cm_data
      until: trust_bundle_cm_data.stdout is search("BEGIN CERTIFICATE")
      retries: 12
      delay: 10
      changed_when: false

    - name: Verify cluster Proxy references trust bundle ConfigMap after phase 1
      ansible.builtin.command:
        cmd: oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: proxy_trusted_ca_name
      until: proxy_trusted_ca_name.stdout == ocp_cluster_trust_bundle_configmap_name
      retries: 12
      delay: 10
      changed_when: false

    - name: Fail when trustedCA ConfigMap is not wired into cluster Proxy
      ansible.builtin.fail:
        msg: >-
          spec.trustedCA.name is '{{ proxy_trusted_ca_name.stdout | default('empty') }}', expected
          '{{ ocp_cluster_trust_bundle_configmap_name }}'. Inspect:
          oc get configmap {{ ocp_cluster_trust_bundle_configmap_name }} -n {{ ocp_cluster_trust_bundle_namespace }} -o yaml
          oc get proxy cluster -o yaml
      when: proxy_trusted_ca_name.stdout != ocp_cluster_trust_bundle_configmap_name

    - name: Wait for worker MCP to start trust bundle rollout (optional)
      ansible.builtin.command:
        cmd: >-
          oc get machineconfigpool worker
          -o jsonpath='{.status.configuration.name}{" "}{.status.conditions[?(@.type=="Updated")].status}{" "}{.status.conditions[?(@.type=="Updating")].status}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: mcp_worker_rollout_ack
      until: >
        mcp_worker_rollout_ack.stdout.split()[0] != mcp_worker_before.stdout or
        mcp_worker_rollout_ack.stdout.split()[2] | default('False') == 'True'
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false
      when: ocp_trust_bundle_cm_applied | bool

    - name: Wait for worker trust bundle rollout before enabling proxy
      ansible.builtin.command:
        cmd: >-
          oc get machineconfigpool worker
          -o jsonpath='{.status.configuration.name}{" "}{.status.conditions[?(@.type=="Updated")].status}{" "}{.status.conditions[?(@.type=="Updating")].status}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: mcp_worker_trust_status
      until: >
        mcp_worker_trust_status.stdout.split()[1] | default('') == 'True' and
        mcp_worker_trust_status.stdout.split()[2] | default('True') == 'False'
      retries: "{{ ocp_cluster_proxy_mcp_wait_retries }}"
      delay: "{{ ocp_cluster_proxy_mcp_wait_delay }}"
      changed_when: false
      when: ocp_trust_bundle_cm_applied | bool

    - name: Note skipped worker trust bundle wait (ConfigMap unchanged)
      ansible.builtin.debug:
        msg: >-
          openshift-config/{{ ocp_cluster_trust_bundle_configmap_name }} apply reported unchanged;
          skipping MachineConfigPool wait (workers should already have the current trust bundle).
      when: not (ocp_trust_bundle_cm_applied | bool)

    - name: "Phase 2 — apply cluster-wide proxy settings"
      ansible.builtin.command:
        cmd: oc apply -f {{ pki_local_export_path }}/cluster-proxy.yaml
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: proxy_apply
      changed_when: "'configured' in proxy_apply.stdout or 'created' in proxy_apply.stdout"

    - name: Verify cluster Proxy spec contains proxy URL and trustedCA after phase 2
      ansible.builtin.command:
        cmd: >-
          oc get proxy cluster
          -o jsonpath='http={.spec.httpProxy} https={.spec.httpsProxy} trustedCA={.spec.trustedCA.name}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: proxy_final_spec
      changed_when: false

    - name: Fail when final cluster Proxy spec is incomplete
      ansible.builtin.fail:
        msg: >-
          Cluster Proxy spec is incomplete after apply: {{ proxy_final_spec.stdout }}.
          Expected http/https proxy {{ ocp_effective_cluster_proxy_url }} and
          trustedCA.name={{ ocp_cluster_trust_bundle_configmap_name }}.
      when: >
        ocp_effective_cluster_proxy_url not in proxy_final_spec.stdout or
        ocp_cluster_trust_bundle_configmap_name not in proxy_final_spec.stdout

    - name: Wait for worker MachineConfigPool rollout to complete
      ansible.builtin.command:
        cmd: >-
          oc get machineconfigpool worker
          -o jsonpath='{.status.configuration.name}{" "}{.status.conditions[?(@.type=="Updated")].status}{" "}{.status.conditions[?(@.type=="Updating")].status}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: mcp_worker_status
      until: >
        mcp_worker_status.stdout.split()[1] | default('') == 'True' and
        mcp_worker_status.stdout.split()[2] | default('False') == 'False'
      retries: "{{ ocp_cluster_proxy_mcp_wait_retries }}"
      delay: "{{ ocp_cluster_proxy_mcp_wait_delay }}"
      changed_when: false

    - name: Wait for master MachineConfigPool rollout to complete
      ansible.builtin.command:
        cmd: >-
          oc get machineconfigpool master
          -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}{" "}{.status.conditions[?(@.type=="Updating")].status}'
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      register: mcp_master_status
      until: >
        mcp_master_status.stdout.split()[0] | default('') == 'True' and
        mcp_master_status.stdout.split()[1] | default('False') == 'False'
      retries: "{{ ocp_cluster_proxy_mcp_wait_retries }}"
      delay: "{{ ocp_cluster_proxy_mcp_wait_delay }}"
      changed_when: false

    - name: Display cluster proxy summary
      ansible.builtin.debug:
        msg:
          - "Cluster httpProxy/httpsProxy: {{ ocp_effective_cluster_proxy_url }}"
          - "Cluster noProxy: {{ ocp_effective_cluster_no_proxy }}"
          - "Trust bundle ConfigMap: {{ ocp_cluster_trust_bundle_namespace }}/{{ ocp_cluster_trust_bundle_configmap_name }}"
          - "Trust bundle includes: lab root CA{% if ocp_cluster_trust_include_intermediate_ca | bool %}, cert-manager intermediate CA{% endif %}{% if ocp_cluster_trust_include_ingress_ca | bool %}, ingress router CA{% endif %}{% if ocp_cluster_trust_merge_existing_user_ca_bundle | bool %}, prior user-ca-bundle PEMs{% endif %}"
          - "Cluster Proxy spec.trustedCA.name wired before proxy rollout completes"
          - "Trust bundle manifest: {{ pki_local_export_path }}/cluster-trust-bundle-configmap.yaml"
          - "Full proxy manifest: {{ pki_local_export_path }}/cluster-proxy.yaml"
          - "MachineConfig pools report Updated=True (nodes may have rebooted during rollout)"

- import_playbook: ../enable-proxy-mitm.yml
