---
- name: Scale worker MachineSet replicas
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all.yml

  tasks:
    - name: Verify kubeconfig file exists
      ansible.builtin.stat:
        path: "{{ ocp_kubeconfig }}"
      register: kubeconfig_stat

    - name: Fail when kubeconfig is missing
      ansible.builtin.fail:
        msg: "Kubeconfig not found at {{ ocp_kubeconfig }}. Run connect-cluster.yml first or set KUBECONFIG."
      when: not kubeconfig_stat.stat.exists

    - name: Get MachineSets
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: MachineSet
        namespace: "{{ ocp_machineset_namespace }}"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: machinesets_info
      until: machinesets_info is succeeded
      retries: 30
      delay: 10

    - name: Filter worker MachineSets
      ansible.builtin.set_fact:
        worker_machinesets: >-
          {{
            machinesets_info.resources
            | json_query(worker_machineset_query)
          }}
      vars:
        worker_machineset_query: >-
          [?spec.template.metadata.labels."machine.openshift.io/cluster-api-machine-role"=='worker']

    - name: Fail when no worker MachineSets are found
      ansible.builtin.fail:
        msg: "No worker MachineSets found in {{ ocp_machineset_namespace }}."
      when: worker_machinesets | length == 0

    # When multiple worker MachineSets exist and no name is set, pick the one in
    # the same AZ as a control-plane (master) Machine. Prefer Machines over Nodes:
    # same API group as MachineSets, and AZ lives in providerSpec.placement.
    # Retries cover transient API refusals after proxy / machine-config rolls.
    - name: Get control-plane Machines for AZ matching
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        namespace: "{{ ocp_machineset_namespace }}"
        label_selectors:
          - "machine.openshift.io/cluster-api-machine-role=master"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: master_machines_info
      until: master_machines_info is succeeded
      retries: 30
      delay: 10
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1

    - name: Resolve master availability zone from Machines
      ansible.builtin.set_fact:
        master_availability_zone: >-
          {{
            master_machines_info.resources[0].spec.providerSpec.value.placement.availabilityZone
            | default(
                master_machines_info.resources[0].metadata.labels['failure-domain.beta.kubernetes.io/zone']
                | default(
                    master_machines_info.resources[0].metadata.labels['topology.kubernetes.io/zone']
                    | default('', true),
                    true
                  ),
                true
              )
          }}
        master_az_source: "machine/{{ master_machines_info.resources[0].metadata.name }}"
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_machines_info.resources | default([]) | length) > 0

    # Fallback: Node topology labels (e.g. topology.kubernetes.io/zone=us-east-2a).
    - name: Get control-plane nodes for AZ matching
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - "node-role.kubernetes.io/master"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: master_nodes_info
      until: master_nodes_info is succeeded
      retries: 30
      delay: 10
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_availability_zone | default('') | length) == 0

    - name: Get control-plane nodes via control-plane role if needed
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - "node-role.kubernetes.io/control-plane"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: control_plane_nodes_info
      until: control_plane_nodes_info is succeeded
      retries: 30
      delay: 10
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_availability_zone | default('') | length) == 0
        - (master_nodes_info.resources | default([]) | length) == 0

    - name: Resolve control-plane nodes
      ansible.builtin.set_fact:
        control_plane_nodes: "{{ master_nodes_info.resources if (master_nodes_info.resources | default([]) | length) > 0 else (control_plane_nodes_info.resources | default([])) }}"
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_availability_zone | default('') | length) == 0

    - name: Resolve master availability zone from Nodes
      ansible.builtin.set_fact:
        master_availability_zone: "{{ control_plane_nodes[0].metadata.labels['topology.kubernetes.io/zone'] | default(control_plane_nodes[0].metadata.labels['failure-domain.beta.kubernetes.io/zone'] | default('', true), true) }}"
        master_az_source: "node/{{ control_plane_nodes[0].metadata.name }}"
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_availability_zone | default('') | length) == 0
        - (control_plane_nodes | default([]) | length) > 0

    - name: Fail when master availability zone cannot be determined
      ansible.builtin.fail:
        msg: >-
          Found {{ worker_machinesets | length }} worker MachineSets but could not
          determine control-plane AZ from Machines or Nodes.
          Set ocp_worker_machineset_name explicitly
          (e.g. the MachineSet whose placement.availabilityZone matches the master).
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_availability_zone | default('') | length) == 0

    - name: Match worker MachineSets to master AZ
      ansible.builtin.set_fact:
        worker_machinesets_in_master_az: "{{ worker_machinesets | json_query(az_match_query) }}"
      vars:
        az_match_query: "[?metadata.labels.\"machine.openshift.io/zone\"=='{{ master_availability_zone }}' || metadata.labels.\"topology.kubernetes.io/zone\"=='{{ master_availability_zone }}' || spec.template.spec.providerSpec.value.placement.availabilityZone=='{{ master_availability_zone }}']"
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (master_availability_zone | default('') | length) > 0

    - name: Resolve target worker MachineSet name
      ansible.builtin.set_fact:
        target_worker_machineset_name: "{{ ocp_worker_machineset_name if ocp_worker_machineset_name | length > 0 else (worker_machinesets[0].metadata.name if worker_machinesets | length == 1 else (worker_machinesets_in_master_az[0].metadata.name if (worker_machinesets_in_master_az | default([]) | length) == 1 else '')) }}"

    - name: Fail when master AZ matches multiple worker MachineSets
      ansible.builtin.fail:
        msg: >-
          Found {{ worker_machinesets_in_master_az | length }} worker MachineSets
          in master AZ {{ master_availability_zone }}:
          {{ worker_machinesets_in_master_az | map(attribute='metadata.name') | list | join(', ') }}.
          Set ocp_worker_machineset_name to the MachineSet to scale.
      when:
        - ocp_worker_machineset_name | length == 0
        - (worker_machinesets_in_master_az | default([]) | length) > 1

    - name: Fail when no worker MachineSet matches master AZ
      ansible.builtin.fail:
        msg: >-
          Found {{ worker_machinesets | length }} worker MachineSets but none in
          master AZ {{ master_availability_zone }}
          (from {{ master_az_source | default('unknown') }}).
          Available MachineSets:
          {{ worker_machinesets | map(attribute='metadata.name') | list | join(', ') }}.
          Set ocp_worker_machineset_name explicitly.
      when:
        - ocp_worker_machineset_name | length == 0
        - worker_machinesets | length > 1
        - (worker_machinesets_in_master_az | default([]) | length) == 0

    - name: Fail when target worker MachineSet could not be resolved
      ansible.builtin.fail:
        msg: "Could not resolve a worker MachineSet to scale."
      when: target_worker_machineset_name | length == 0

    - name: Get current worker MachineSet state
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: MachineSet
        name: "{{ target_worker_machineset_name }}"
        namespace: "{{ ocp_machineset_namespace }}"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: target_machineset_info
      until: target_machineset_info is succeeded
      retries: 30
      delay: 10

    - name: Record current replica count
      ansible.builtin.set_fact:
        current_worker_machineset_replicas: "{{ target_machineset_info.resources[0].spec.replicas | default(0) | int }}"

    - name: Scale worker MachineSet replicas
      ansible.builtin.command:
        argv:
          - oc
          - patch
          - machineset
          - "{{ target_worker_machineset_name }}"
          - -n
          - "{{ ocp_machineset_namespace }}"
          - --type=merge
          - -p
          - "{{ machineset_scale_patch | to_json }}"
      environment:
        KUBECONFIG: "{{ ocp_kubeconfig }}"
      vars:
        machineset_scale_patch: "{{ {'spec': {'replicas': ocp_worker_machineset_replicas | int}} }}"
      when: current_worker_machineset_replicas != (ocp_worker_machineset_replicas | int)
      register: machineset_scale_result
      changed_when: machineset_scale_result.rc == 0

    - name: Wait for worker MachineSet replicas to become available
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: MachineSet
        name: "{{ target_worker_machineset_name }}"
        namespace: "{{ ocp_machineset_namespace }}"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: scaled_machineset_info
      until: >
        (
          scaled_machineset_info.resources[0].status.readyReplicas | default(0) | int
        ) >= (ocp_worker_machineset_replicas | int) and (
          scaled_machineset_info.resources[0].status.availableReplicas | default(0) | int
        ) >= (ocp_worker_machineset_replicas | int)
      retries: 60
      delay: 30
      when: ocp_worker_machineset_replicas | int > 0

    - name: Wait for worker machines to reach Running phase
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        namespace: "{{ ocp_machineset_namespace }}"
        label_selectors:
          - "machine.openshift.io/cluster-api-machineset={{ target_worker_machineset_name }}"
        kubeconfig: "{{ ocp_kubeconfig }}"
        validate_certs: "{{ ocp_verify_ssl }}"
      register: worker_machines_info
      until: >
        (
          worker_machines_info.resources
          | selectattr('status.phase', 'equalto', 'Running')
          | list
          | length
        ) >= (ocp_worker_machineset_replicas | int)
      retries: 60
      delay: 30
      when: ocp_worker_machineset_replicas | int > 0

    - name: Display MachineSet scaling summary
      ansible.builtin.debug:
        msg:
          - "MachineSet: {{ target_worker_machineset_name }}"
          - "Master AZ: {{ master_availability_zone | default('n/a (single MachineSet or explicit name)') }} ({{ master_az_source | default('n/a') }})"
          - "Replicas: {{ current_worker_machineset_replicas }} -> {{ ocp_worker_machineset_replicas }}"
          - "Ready replicas: {{ scaled_machineset_info.resources[0].status.readyReplicas | default(current_worker_machineset_replicas) if scaled_machineset_info is defined else current_worker_machineset_replicas }}"
          - "Available replicas: {{ scaled_machineset_info.resources[0].status.availableReplicas | default(current_worker_machineset_replicas) if scaled_machineset_info is defined else current_worker_machineset_replicas }}"
          - "Running machines: {{ worker_machines_info.resources | selectattr('status.phase', 'equalto', 'Running') | list | length if worker_machines_info is defined else 'n/a' }}"
