---
- name: Launch EC2 instances in {{ ec2_subnet_candidate.availability_zone }}
  block:
    - name: Launch EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ ec2_ami }}"
        key_name: "{{ ec2_key_name }}"
        subnet_id: "{{ ec2_subnet_candidate.subnet_id }}"
        security_group: "{{ sg_result.group_id }}"
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ ec2_root_volume_size }}"
              volume_type: "{{ ec2_root_volume_type }}"
              iops: "{{ ec2_root_volume_iops }}"
              throughput: "{{ ec2_root_volume_throughput }}"
              delete_on_termination: true
        network:
          assign_public_ip: true
        state: started
        wait: true
      loop: "{{ ec2_instance_names }}"
      register: ec2_results

    - name: Record successful EC2 launch AZ and subnet
      ansible.builtin.set_fact:
        ec2_launch_complete: true
        ec2_subnet_id: "{{ ec2_subnet_candidate.subnet_id }}"
        ec2_launch_availability_zone: "{{ ec2_subnet_candidate.availability_zone }}"

  rescue:
    - name: Detect insufficient instance capacity for AZ retry
      ansible.builtin.set_fact:
        ec2_launch_is_insufficient_capacity: >-
          {{
            'InsufficientInstanceCapacity' in (ansible_failed_result.msg | default(''))
            or (ansible_failed_result.error.code | default('')) == 'InsufficientInstanceCapacity'
            or (
              ansible_failed_result.results | default([])
              | selectattr('failed', 'defined')
              | selectattr('failed')
              | map(attribute='error', default={})
              | map(attribute='code', default='')
              | select('equalto', 'InsufficientInstanceCapacity')
              | list
              | length > 0
            )
          }}

    - name: Record AZ capacity failure for summary
      ansible.builtin.set_fact:
        ec2_launch_attempt_errors: >-
          {{
            ec2_launch_attempt_errors + [{
              'availability_zone': ec2_subnet_candidate.availability_zone,
              'subnet_id': ec2_subnet_candidate.subnet_id,
              'message': ansible_failed_result.msg | default('EC2 launch failed')
            }]
          }}
      when: ec2_launch_is_insufficient_capacity | bool

    - name: Re-raise non-capacity EC2 launch errors
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('EC2 launch failed') }}"
      when: not (ec2_launch_is_insufficient_capacity | bool)
