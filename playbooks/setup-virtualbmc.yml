---
- name: Set up VirtualBMC for IPMI / Serial-over-LAN
  hosts: hypervisors
  become: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    # Use distro python3-libvirt + a dedicated venv (system-site-packages) so we do
    # not build libvirt-python against the controller's project venv (e.g. Python 3.14).
    - name: Install VirtualBMC OS packages
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
          - python3-libvirt
          - ipmitool
          - firewalld
          - libvirt-devel
          - python3-devel
          - gcc
          - pkgconf-pkg-config
        state: present

    # Avoid ansible.builtin.pip here: with ansible_python_interpreter=/usr/bin/python3
    # that module requires distro python3-packaging, which may be missing.
    - name: Check for existing VirtualBMC virtualenv
      ansible.builtin.stat:
        path: "{{ vbmc_install_dir }}/pyvenv.cfg"
      register: vbmc_pyvenv_cfg_stat

    - name: Read VirtualBMC pyvenv.cfg
      ansible.builtin.slurp:
        src: "{{ vbmc_install_dir }}/pyvenv.cfg"
      register: vbmc_pyvenv_cfg
      when: vbmc_pyvenv_cfg_stat.stat.exists

    - name: Remove VirtualBMC virtualenv lacking system site packages
      ansible.builtin.file:
        path: "{{ vbmc_install_dir }}"
        state: absent
      when:
        - vbmc_pyvenv_cfg_stat.stat.exists
        - "'include-system-site-packages = true' not in (vbmc_pyvenv_cfg.content | b64decode)"

    - name: Create VirtualBMC virtualenv with system site packages
      ansible.builtin.command:
        cmd: /usr/bin/python3 -m venv --system-site-packages {{ vbmc_install_dir }}
        creates: "{{ vbmc_install_dir }}/bin/python"

    - name: Install virtualbmc into dedicated virtualenv
      ansible.builtin.command:
        cmd: "{{ vbmc_install_dir }}/bin/pip install --upgrade virtualbmc"
      register: vbmc_pip_install
      changed_when: "'Successfully installed' in vbmc_pip_install.stdout"

    - name: Create VirtualBMC directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ vbmc_config_dir }}"
        - "{{ vbmc_state_dir }}"
        - "{{ vbmc_log_dir }}"

    - name: Deploy VirtualBMC config
      ansible.builtin.template:
        src: ../templates/virtualbmc.conf.j2
        dest: "{{ vbmc_config_dir }}/virtualbmc.conf"
        mode: "0644"
      notify: Restart vbmcd

    - name: Create systemd service for vbmcd
      ansible.builtin.copy:
        dest: /etc/systemd/system/vbmcd.service
        mode: "0644"
        content: |
          [Unit]
          Description=VirtualBMC IPMI emulator
          After=libvirtd.service network-online.target
          Requires=libvirtd.service
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=VIRTUALBMC_CONFIG={{ vbmc_config_dir }}/virtualbmc.conf
          ExecStart={{ vbmc_install_dir }}/bin/vbmcd --foreground
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart vbmcd

    # Use firewall-cmd instead of ansible.posix.firewalld — that module needs
    # python3-firewall on the interpreter, which is often missing on minimal hosts.
    - name: Open firewall UDP ports for VirtualBMC on libvirt zone (permanent)
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=libvirt
          - --add-port={{ item.port }}/udp
      loop: "{{ vbmc_domains }}"
      register: vbmc_fw_permanent
      changed_when: "'success' in (vbmc_fw_permanent.stdout | default('') | lower)"
      failed_when:
        - vbmc_fw_permanent.rc != 0
        - "'ALREADY_ENABLED' not in ((vbmc_fw_permanent.stdout | default('')) ~ (vbmc_fw_permanent.stderr | default('')))"
      loop_control:
        label: "{{ item.name }}:{{ item.port }}/udp"

    - name: Open firewall UDP ports for VirtualBMC on libvirt zone (runtime)
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone=libvirt
          - --add-port={{ item.port }}/udp
      loop: "{{ vbmc_domains }}"
      register: vbmc_fw_runtime
      changed_when: "'success' in (vbmc_fw_runtime.stdout | default('') | lower)"
      failed_when:
        - vbmc_fw_runtime.rc != 0
        - "'ALREADY_ENABLED' not in ((vbmc_fw_runtime.stdout | default('')) ~ (vbmc_fw_runtime.stderr | default('')))"
      loop_control:
        label: "{{ item.name }}:{{ item.port }}/udp"

    - name: Enable and start vbmcd
      ansible.builtin.systemd:
        name: vbmcd
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers so vbmcd is ready before vbmc client calls
      ansible.builtin.meta: flush_handlers

    - name: Wait for vbmcd control socket
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc list"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      register: vbmc_list_ready
      retries: 10
      delay: 2
      until: vbmc_list_ready.rc == 0
      changed_when: false

    - name: Check whether each managed domain exists in libvirt
      ansible.builtin.command: virsh dominfo {{ item.name }}
      loop: "{{ vbmc_domains }}"
      register: vbmc_domain_exists
      failed_when: false
      changed_when: false
      loop_control:
        label: "{{ item.name }}"

    - name: Set domains present in libvirt
      ansible.builtin.set_fact:
        vbmc_domains_present: >-
          {{
            vbmc_domain_exists.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}
        vbmc_domains_missing: >-
          {{
            vbmc_domain_exists.results
            | rejectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | map(attribute='name')
            | list
          }}

    - name: Warn when configured VirtualBMC domains are missing
      ansible.builtin.debug:
        msg: >-
          Skipping VirtualBMC for missing libvirt domains:
          {{ vbmc_domains_missing | join(', ') }}
      when: vbmc_domains_missing | length > 0

    - name: Check for existing PTY serial console on each domain
      ansible.builtin.shell: >
        virsh dumpxml {{ item.name }} | grep -E '<serial type=.pty'
      loop: "{{ vbmc_domains_present }}"
      register: vbmc_serial_check
      failed_when: false
      changed_when: false
      loop_control:
        label: "{{ item.name }}"

    - name: Add PTY serial console for IPMI SOL
      ansible.builtin.command: >
        virt-xml {{ item.item.name }} --add-device --serial pty
      loop: "{{ vbmc_serial_check.results }}"
      when: item.rc != 0
      loop_control:
        label: "{{ item.item.name }}"

    - name: List configured VirtualBMC instances
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc list"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      register: vbmc_list
      changed_when: false

    - name: Add VirtualBMC instance when missing
      ansible.builtin.command: >
        {{ vbmc_install_dir }}/bin/vbmc add {{ item.name }}
        --address {{ vbmc_listen_ip }}
        --port {{ item.port }}
        --username {{ vbmc_username }}
        --password {{ vbmc_password }}
        --libvirt-uri {{ vbmc_libvirt_uri }}
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      loop: "{{ vbmc_domains_present }}"
      when: item.name not in vbmc_list.stdout
      no_log: true
      loop_control:
        label: "{{ item.name }}:{{ item.port }}"

    - name: Start each VirtualBMC instance
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc start {{ item.name }}"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      loop: "{{ vbmc_domains_present }}"
      register: vbmc_start
      changed_when: vbmc_start.rc == 0
      failed_when:
        - vbmc_start.rc != 0
        - "'already running' not in ((vbmc_start.stderr | default('')) ~ (vbmc_start.stdout | default('')))"
      loop_control:
        label: "{{ item.name }}"

    - name: Refresh VirtualBMC list
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc list"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      register: vbmc_list_final
      changed_when: false

    - name: Probe IPMI power status for each VirtualBMC
      ansible.builtin.command: >
        ipmitool -I lanplus -C 3
        -H {{ vbmc_listen_ip }}
        -p {{ item.port }}
        -U {{ vbmc_username }}
        -P {{ vbmc_password }}
        power status
      loop: "{{ vbmc_domains_present }}"
      register: vbmc_power_probe
      when: vbmc_domains_present | length > 0
      changed_when: false
      retries: 5
      delay: 2
      until: vbmc_power_probe.rc == 0
      no_log: true
      loop_control:
        label: "{{ item.name }}"

    - name: Build IPMI endpoint summary lines
      ansible.builtin.set_fact:
        vbmc_endpoint_lines: >-
          {{
            vbmc_endpoint_lines | default([]) + [
              item.name ~ ': ipmitool -I lanplus -C 3 -H ' ~ vbmc_listen_ip
              ~ ' -p ' ~ (item.port | string)
              ~ ' -U ' ~ vbmc_username
              ~ ' -P <password> power status'
            ]
          }}
      loop: "{{ vbmc_domains_present }}"
      when: vbmc_domains_present | length > 0
      loop_control:
        label: "{{ item.name }}"

    - name: Display VirtualBMC / IPMI SOL summary
      ansible.builtin.debug:
        msg: "{{ vbmc_summary_msg }}"
      vars:
        vbmc_summary_msg: >-
          {{
            ['VirtualBMC list:']
            + (vbmc_list_final.stdout_lines | default([]))
            + ['', 'IPMI endpoints (power / boot / SOL):']
            + (vbmc_endpoint_lines | default(['(no domains present)']))
            + (
                [
                  '',
                  'SOL activate (disconnect virsh console first); exit with Enter then ~. :',
                  'ipmitool -I lanplus -C 3 -H ' ~ vbmc_listen_ip
                  ~ ' -p ' ~ (vbmc_domains_present[0].port | string)
                  ~ ' -U ' ~ vbmc_username
                  ~ ' -P <password> sol activate'
                ]
                if (vbmc_domains_present | length > 0)
                else []
              )
          }}

  handlers:
    - name: Restart vbmcd
      ansible.builtin.systemd:
        name: vbmcd
        state: restarted
        daemon_reload: true
