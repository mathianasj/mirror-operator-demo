---
# iDRAC-like BMC per libvirt VM: Redfish (TCP 443) + IPMI/SOL (UDP 623) on the same BMC IP.
- name: Discover existing hypervisor EC2 instances
  ansible.builtin.import_playbook: discover-hypervisors.yml

- name: Configure per-VM Redfish + IPMI BMCs
  hosts: hypervisors
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Assert BMC password fits bcrypt limit (sushy/oslo)
      ansible.builtin.assert:
        that:
          - (bmc_password | length) > 0
          - (bmc_password | length) <= 72
        fail_msg: >-
          bmc_password is {{ bmc_password | length }} characters;
          bcrypt allows at most 72.

    - name: Install BMC OS packages
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
          - python3-libvirt
          - python3.11
          - git
          - ipmitool
          - httpd-tools
          - openssl
        state: present

    - name: Install sushy-tools with system pip
      ansible.builtin.command:
        cmd: /usr/bin/python3 -m pip install --upgrade sushy-tools
      register: sushy_pip_install
      changed_when: "'Successfully installed' in sushy_pip_install.stdout"

    # VirtualBMC master needs Python >= 3.11. Prefer the newest available interpreter.
    - name: Discover Python >= 3.11 for VirtualBMC venv
      ansible.builtin.shell: |
        set -e
        for cand in /usr/bin/python3.14 /usr/bin/python3.13 /usr/bin/python3.12 /usr/bin/python3.11; do
          if [ -x "$cand" ]; then
            ver="$("$cand" -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
            major="${ver%%.*}"
            minor="${ver#*.}"
            if [ "$major" -gt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -ge 11 ]; }; then
              echo "$cand"
              exit 0
            fi
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: vbmc_python_discover
      changed_when: false
      failed_when: false

    - name: Fail when no Python >= 3.11 is available for VirtualBMC
      ansible.builtin.fail:
        msg: >-
          VirtualBMC master requires Python >= 3.11, but none of
          /usr/bin/python3.11–3.14 were found. Install python3.11 (or newer)
          and re-run setup-bmc.yml.
      when: vbmc_python_discover.rc != 0

    - name: Set VirtualBMC Python interpreter
      ansible.builtin.set_fact:
        vbmc_python: "{{ vbmc_python_discover.stdout | trim }}"

    - name: Check for existing VirtualBMC virtualenv
      ansible.builtin.stat:
        path: "{{ vbmc_install_dir }}/pyvenv.cfg"
      register: vbmc_pyvenv_cfg_stat

    - name: Check for existing VirtualBMC venv Python binary
      ansible.builtin.stat:
        path: "{{ vbmc_install_dir }}/bin/python"
      register: vbmc_venv_python_stat

    - name: Read VirtualBMC pyvenv.cfg
      ansible.builtin.slurp:
        src: "{{ vbmc_install_dir }}/pyvenv.cfg"
      register: vbmc_pyvenv_cfg
      when: vbmc_pyvenv_cfg_stat.stat.exists

    - name: Probe existing VirtualBMC venv Python version
      ansible.builtin.command:
        argv:
          - "{{ vbmc_install_dir }}/bin/python"
          - -c
          - |
            import sys
            print("%d.%d" % sys.version_info[:2])
            raise SystemExit(0 if sys.version_info[:2] >= (3, 11) else 1)
      register: vbmc_venv_py_ver
      changed_when: false
      failed_when: false
      when: vbmc_venv_python_stat.stat.exists

    - name: Decide whether to recreate VirtualBMC virtualenv
      ansible.builtin.set_fact:
        vbmc_recreate_venv: "{{
            (not vbmc_pyvenv_cfg_stat.stat.exists)
            or (not vbmc_venv_python_stat.stat.exists)
            or (vbmc_venv_py_ver.rc | default(1) != 0)
            or (
              vbmc_pyvenv_cfg_stat.stat.exists
              and ('include-system-site-packages = true'
                   not in (vbmc_pyvenv_cfg.content | default('') | b64decode))
            )
          }}"

    - name: Remove broken or outdated VirtualBMC virtualenv
      ansible.builtin.file:
        path: "{{ vbmc_install_dir }}"
        state: absent
      when: vbmc_recreate_venv

    - name: Create VirtualBMC virtualenv with Python >= 3.11
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_python }} -m venv --system-site-packages
          {{ vbmc_install_dir }}
        creates: "{{ vbmc_install_dir }}/bin/python"

    - name: Upgrade pip inside VirtualBMC virtualenv
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_install_dir }}/bin/python -m pip install --upgrade
          'pip>=23' setuptools wheel
      register: vbmc_pip_bootstrap
      changed_when: "'Successfully installed' in vbmc_pip_bootstrap.stdout"

    # Install from GitHub master (ships SOL). PyPI 3.3.0 has power/boot only.
    # Canonical source is OpenDev; GitHub openstack/virtualbmc is the public mirror.
    - name: Install virtualbmc from GitHub master into dedicated virtualenv
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_install_dir }}/bin/pip install --upgrade --force-reinstall
          --no-deps
          {{ vbmc_pip_package }}
      register: vbmc_pip_install
      changed_when: >-
        'Successfully installed' in vbmc_pip_install.stdout
        or 'Successfully uninstalled' in vbmc_pip_install.stdout
      notify: Restart vbmcd

    - name: Install VirtualBMC Python dependencies (except libvirt-python)
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_install_dir }}/bin/pip install --upgrade
          'pbr!=2.1.0,>=2.0.0'
          'pyghmi>=1.2.0'
          'cliff!=2.9.0,>=2.8.0'
          'pyzmq>=19.0.0'
      register: vbmc_pip_deps
      changed_when: "'Successfully installed' in vbmc_pip_deps.stdout"

    - name: Check VirtualBMC console scripts after install
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ vbmc_install_dir }}/bin/vbmc"
        - "{{ vbmc_install_dir }}/bin/vbmcd"
      register: vbmc_scripts

    # If scripts are still missing, wipe the venv, recreate with Python >= 3.11, reinstall once.
    - name: Remove VirtualBMC virtualenv after missing console scripts
      ansible.builtin.file:
        path: "{{ vbmc_install_dir }}"
        state: absent
      when: not (vbmc_scripts.results | map(attribute='stat.exists') | min)

    - name: Recreate VirtualBMC virtualenv after missing console scripts
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_python }} -m venv --system-site-packages
          {{ vbmc_install_dir }}
      when: not (vbmc_scripts.results | map(attribute='stat.exists') | min)

    - name: Re-upgrade pip after VirtualBMC venv recreate
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_install_dir }}/bin/python -m pip install --upgrade
          'pip>=23' setuptools wheel
      register: vbmc_pip_bootstrap_retry
      changed_when: "'Successfully installed' in vbmc_pip_bootstrap_retry.stdout"
      when: not (vbmc_scripts.results | map(attribute='stat.exists') | min)

    - name: Reinstall virtualbmc after VirtualBMC venv recreate
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_install_dir }}/bin/pip install --upgrade --force-reinstall
          --no-deps
          {{ vbmc_pip_package }}
      register: vbmc_pip_install_retry
      changed_when: >-
        'Successfully installed' in vbmc_pip_install_retry.stdout
        or 'Successfully uninstalled' in vbmc_pip_install_retry.stdout
      notify: Restart vbmcd
      when: not (vbmc_scripts.results | map(attribute='stat.exists') | min)

    - name: Reinstall VirtualBMC Python dependencies after venv recreate
      ansible.builtin.command:
        cmd: >-
          {{ vbmc_install_dir }}/bin/pip install --upgrade
          'pbr!=2.1.0,>=2.0.0'
          'pyghmi>=1.2.0'
          'cliff!=2.9.0,>=2.8.0'
          'pyzmq>=19.0.0'
      register: vbmc_pip_deps_retry
      changed_when: "'Successfully installed' in vbmc_pip_deps_retry.stdout"
      when: not (vbmc_scripts.results | map(attribute='stat.exists') | min)

    - name: Re-check VirtualBMC console scripts after recreate
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ vbmc_install_dir }}/bin/vbmc"
        - "{{ vbmc_install_dir }}/bin/vbmcd"
      register: vbmc_scripts_final
      when: not (vbmc_scripts.results | map(attribute='stat.exists') | min)

    - name: Fail when vbmc/vbmcd scripts are missing
      ansible.builtin.fail:
        msg: >-
          {{ vbmc_install_dir }}/bin/vbmc or vbmcd missing after pip install
          of {{ vbmc_pip_package }} (Python {{ vbmc_python }}).
          pip stdout: {{ (vbmc_pip_install_retry.stdout | default(vbmc_pip_install.stdout)) | default('') }}
          pip stderr: {{ (vbmc_pip_install_retry.stderr | default(vbmc_pip_install.stderr)) | default('') }}.
          Fix (as root): recreate {{ vbmc_install_dir }} with {{ vbmc_python }} -m venv
          --system-site-packages and reinstall {{ vbmc_pip_package }}.
      when: >-
        not (
          (vbmc_scripts_final.results | default(vbmc_scripts.results))
          | map(attribute='stat.exists') | min
        )

    - name: Create BMC directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/sushy
        - /etc/sushy/tls
        - /etc/sushy/nodes
        - "{{ vbmc_config_dir }}"
        - "{{ vbmc_state_dir }}"
        - "{{ vbmc_log_dir }}"

    - name: Deploy BMC address helper script
      ansible.builtin.template:
        src: ../templates/bmc-addresses.sh.j2
        dest: /usr/local/sbin/bmc-addresses.sh
        mode: "0755"

    - name: Deploy BMC addresses systemd unit
      ansible.builtin.template:
        src: ../templates/bmc-addresses.service.j2
        dest: /etc/systemd/system/bmc-addresses.service
        mode: "0644"

    - name: Enable and run BMC address aliases
      ansible.builtin.systemd:
        name: bmc-addresses
        enabled: true
        state: started
        daemon_reload: true

    - name: Check if shared BMC TLS certificate exists
      ansible.builtin.stat:
        path: "{{ sushy_emulator_ssl_cert }}"
      register: sushy_cert

    - name: Generate shared self-signed BMC TLS certificate
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048
        -keyout {{ sushy_emulator_ssl_key }}
        -out {{ sushy_emulator_ssl_cert }}
        -days 365 -nodes
        -subj "/CN=bmc-emulator"
      when: not sushy_cert.stat.exists

    - name: Create shared Redfish htpasswd file
      ansible.builtin.command:
        argv:
          - htpasswd
          - -cbB
          - "{{ sushy_emulator_auth_file }}"
          - "{{ bmc_username }}"
          - "{{ bmc_password }}"
      changed_when: true
      no_log: true

    - name: Restrict Redfish htpasswd permissions
      ansible.builtin.file:
        path: "{{ sushy_emulator_auth_file }}"
        mode: "0600"

    - name: Deploy sushy-emulator systemd template
      ansible.builtin.template:
        src: ../templates/sushy-emulator@.service.j2
        dest: /etc/systemd/system/sushy-emulator@.service
        mode: "0644"

    - name: Stop and disable legacy monolithic sushy-emulator
      ansible.builtin.systemd:
        name: sushy-emulator
        enabled: false
        state: stopped
      failed_when: false

    - name: Check whether each BMC domain exists in libvirt
      ansible.builtin.command: virsh dominfo {{ item.name }}
      loop: "{{ bmc_nodes }}"
      register: bmc_domain_exists
      failed_when: false
      changed_when: false
      loop_control:
        label: "{{ item.name }}"

    - name: Set BMC nodes present in libvirt
      ansible.builtin.set_fact:
        bmc_nodes_present: >-
          {{
            bmc_domain_exists.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}
        bmc_nodes_missing: >-
          {{
            bmc_domain_exists.results
            | rejectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | map(attribute='name')
            | list
          }}

    - name: Warn when configured BMC domains are missing
      ansible.builtin.debug:
        msg: "Skipping BMC setup for missing libvirt domains: {{ bmc_nodes_missing | join(', ') }}"
      when: bmc_nodes_missing | length > 0

    - name: Resolve libvirt UUID for each BMC node
      ansible.builtin.command: virsh domuuid {{ item.name }}
      loop: "{{ bmc_nodes_present }}"
      register: bmc_uuid_results
      changed_when: false
      loop_control:
        label: "{{ item.name }}"

    - name: Build BMC node facts with UUIDs
      ansible.builtin.set_fact:
        bmc_nodes_ready: >-
          {{
            bmc_nodes_ready | default([]) + [
              item.0 | combine({'uuid': item.1.stdout | trim})
            ]
          }}
      loop: "{{ bmc_nodes_present | zip(bmc_uuid_results.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"

    - name: Ensure PTY serial console for IPMI SOL
      ansible.builtin.shell: |
        if ! virsh dumpxml {{ item.name }} | grep -Eq '<serial type=.pty'; then
          virt-xml {{ item.name }} --add-device --serial pty
        fi
      loop: "{{ bmc_nodes_ready | default([]) }}"
      register: bmc_serial
      changed_when: "'Device added' in bmc_serial.stdout or 'Updated' in bmc_serial.stdout"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy per-node sushy-emulator config
      ansible.builtin.template:
        src: ../templates/sushy-emulator-node.conf.j2
        dest: /etc/sushy/nodes/{{ item.name }}.conf
        mode: "0644"
      loop: "{{ bmc_nodes_ready | default([]) }}"
      notify: Reload sushy BMC instances
      loop_control:
        label: "{{ item.name }} {{ item.bmc_ip }}"

    - name: Enable and restart per-node sushy-emulator
      ansible.builtin.systemd:
        name: "sushy-emulator@{{ item.name }}"
        enabled: true
        state: restarted
        daemon_reload: true
      loop: "{{ bmc_nodes_ready | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy VirtualBMC config
      ansible.builtin.template:
        src: ../templates/virtualbmc.conf.j2
        dest: "{{ vbmc_config_dir }}/virtualbmc.conf"
        mode: "0644"
      notify: Restart vbmcd

    - name: Create systemd service for vbmcd
      ansible.builtin.copy:
        dest: /etc/systemd/system/vbmcd.service
        mode: "0644"
        content: |
          [Unit]
          Description=VirtualBMC IPMI emulator
          After=network-online.target bmc-addresses.service libvirtd.service virtqemud.service
          Wants=network-online.target bmc-addresses.service libvirtd.service virtqemud.service

          [Service]
          Type=simple
          Environment=VIRTUALBMC_CONFIG={{ vbmc_config_dir }}/virtualbmc.conf
          ExecStart={{ vbmc_install_dir }}/bin/vbmcd --foreground
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart vbmcd

    - name: Check whether firewalld is running
      ansible.builtin.command: systemctl is-active firewalld
      register: bmc_firewalld_active
      changed_when: false
      failed_when: false

    - name: Open Redfish TCP port when firewalld is active
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=libvirt
          - --add-port={{ bmc_redfish_port }}/tcp
      when: bmc_firewalld_active.rc == 0
      register: bmc_fw_redfish
      changed_when: "'success' in (bmc_fw_redfish.stdout | default('') | lower)"
      failed_when:
        - bmc_fw_redfish.rc != 0
        - "'ALREADY_ENABLED' not in ((bmc_fw_redfish.stdout | default('')) ~ (bmc_fw_redfish.stderr | default('')))"

    - name: Open IPMI UDP port when firewalld is active
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=libvirt
          - --add-port={{ bmc_ipmi_port }}/udp
      when: bmc_firewalld_active.rc == 0
      register: bmc_fw_ipmi
      changed_when: "'success' in (bmc_fw_ipmi.stdout | default('') | lower)"
      failed_when:
        - bmc_fw_ipmi.rc != 0
        - "'ALREADY_ENABLED' not in ((bmc_fw_ipmi.stdout | default('')) ~ (bmc_fw_ipmi.stderr | default('')))"

    - name: Apply firewalld runtime ports
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone=libvirt
          - --add-port={{ item }}
      loop:
        - "{{ bmc_redfish_port }}/tcp"
        - "{{ bmc_ipmi_port }}/udp"
      when: bmc_firewalld_active.rc == 0
      register: bmc_fw_runtime
      changed_when: "'success' in (bmc_fw_runtime.stdout | default('') | lower)"
      failed_when:
        - bmc_fw_runtime.rc != 0
        - "'ALREADY_ENABLED' not in ((bmc_fw_runtime.stdout | default('')) ~ (bmc_fw_runtime.stderr | default('')))"

    - name: Enable and start vbmcd
      ansible.builtin.systemd:
        name: vbmcd
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers before BMC client checks
      ansible.builtin.meta: flush_handlers

    - name: Wait for vbmcd
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc list"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      register: vbmc_list_ready
      retries: 10
      delay: 2
      until: vbmc_list_ready.rc == 0
      changed_when: false

    - name: List configured VirtualBMC instances
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc list"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      register: vbmc_list
      changed_when: false

    - name: Delete stale VirtualBMC instances to rebind BMC IP and port 623
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc delete {{ item.name }}"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      loop: "{{ bmc_nodes_ready | default([]) }}"
      when: item.name in vbmc_list.stdout
      register: vbmc_delete
      failed_when: false
      changed_when: vbmc_delete.rc == 0
      loop_control:
        label: "{{ item.name }}"

    - name: Add VirtualBMC instance on BMC IP port {{ bmc_ipmi_port }}
      ansible.builtin.command: >
        {{ vbmc_install_dir }}/bin/vbmc add {{ item.name }}
        --address {{ item.bmc_ip }}
        --port {{ bmc_ipmi_port }}
        --username {{ bmc_username }}
        --password {{ bmc_password }}
        --libvirt-uri {{ vbmc_libvirt_uri }}
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      loop: "{{ bmc_nodes_ready | default([]) }}"
      no_log: true
      loop_control:
        label: "{{ item.name }} {{ item.bmc_ip }}"

    - name: Start each VirtualBMC instance
      ansible.builtin.command: "{{ vbmc_install_dir }}/bin/vbmc start {{ item.name }}"
      environment:
        VIRTUALBMC_CONFIG: "{{ vbmc_config_dir }}/virtualbmc.conf"
      loop: "{{ bmc_nodes_ready | default([]) }}"
      register: vbmc_start
      changed_when: vbmc_start.rc == 0
      failed_when:
        - vbmc_start.rc != 0
        - "'already running' not in ((vbmc_start.stderr | default('')) ~ (vbmc_start.stdout | default('')))"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for per-node Redfish root
      ansible.builtin.command: >
        curl -sk -u {{ bmc_username }}:{{ bmc_password }}
        -o /dev/null -w '%{http_code}'
        https://{{ item.bmc_ip }}:{{ bmc_redfish_port }}/redfish/v1
      loop: "{{ bmc_nodes_ready | default([]) }}"
      register: redfish_check
      retries: 10
      delay: 3
      until: redfish_check.stdout == "200"
      changed_when: false
      no_log: true
      loop_control:
        label: "{{ item.name }}"

    - name: Probe IPMI power status on each BMC IP
      ansible.builtin.command: >
        ipmitool -I lanplus -C 3
        -H {{ item.bmc_ip }}
        -p {{ bmc_ipmi_port }}
        -U {{ bmc_username }}
        -P {{ bmc_password }}
        power status
      loop: "{{ bmc_nodes_ready | default([]) }}"
      register: ipmi_probe
      retries: 5
      delay: 2
      until: ipmi_probe.rc == 0
      changed_when: false
      no_log: true
      loop_control:
        label: "{{ item.name }}"

    - name: Display iDRAC-like BMC endpoints
      ansible.builtin.debug:
        msg:
          - "{{ item.name }} (UUID {{ item.uuid }})"
          - "  BMC IP:   {{ item.bmc_ip }}"
          - "  Redfish:  https://{{ item.bmc_ip }}:{{ bmc_redfish_port }}/redfish/v1/Systems/{{ item.uuid }}"
          - "  IPMI/SOL: ipmitool -I lanplus -C 3 -H {{ item.bmc_ip }} -p {{ bmc_ipmi_port }} -U {{ bmc_username }} -P <password> sol activate"
          - "  User:     {{ bmc_username }}"
      loop: "{{ bmc_nodes_ready | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

  handlers:
    - name: Reload sushy BMC instances
      ansible.builtin.systemd:
        name: "sushy-emulator@{{ item.name }}"
        state: restarted
        daemon_reload: true
      loop: "{{ bmc_nodes_ready | default([]) }}"
      when: (bmc_nodes_ready | default([]) | length) > 0
      loop_control:
        label: "{{ item.name }}"

    - name: Restart vbmcd
      ansible.builtin.systemd:
        name: vbmcd
        state: restarted
        daemon_reload: true
